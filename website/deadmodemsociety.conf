# deadmodemsociety + privacy subdomain vhosts
# Save as: /etc/apache2/sites-available/deadmodemsociety.conf
#
# NOTE: Your privacy site should have /var/www/privacywww/index.html (not index.htlm)

<VirtualHost *:80>
    ServerName privacy.deadmodemsociety.com
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/privacywww
    DirectoryIndex index.html index.htm

    <Directory /var/www/privacywww>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/privacy_error.log
    CustomLog ${APACHE_LOG_DIR}/privacy_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName deadmodemsociety.com
    ServerAlias www.deadmodemsociety.com
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html
    DirectoryIndex index.html index.htm index.php

    ErrorLog ${APACHE_LOG_DIR}/deadmodemsociety_error.log
    CustomLog ${APACHE_LOG_DIR}/deadmodemsociety_access.log combined

    RewriteEngine On
    # Force HTTPS + canonical apex domain for the main site
    RewriteRule ^ https://deadmodemsociety.com%{REQUEST_URI} [R=301,L]
</VirtualHost>
